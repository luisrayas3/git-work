        kind: ordinal-enum
        name: Priority
        description: Jira's five priorities, most urgent first.
        values:
        - id: highest
          name: Highest
        - id: high
          name: High
        - id: medium
          name: Medium
        - id: low
          name: Low
        - id: lowest
          name: Lowest
      assignee:
        kind: identity
        name: Assignee
        description: Who is doing the work.
      labels:
        kind: multi-enum
        name: Labels
        description: Free tags; the preset ships none and anything is accepted.
        freeform: true
      due:
        kind: date
        name: Due date
      blocks:
        kind: multi-relation
        name: Blocks
        inverse: blocked_by
      rank:
        kind: rank
