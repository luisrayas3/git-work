---
name: build-and-test

on:
  merge_group:
    types:
      - checks_requested
  pull_request:
    branches:
      - trunk
  push:
    branches:
      - trunk

concurrency:
  # github.workflow is part of the group because concurrency groups are
  # repo-wide: without it a push to trunk would share a group with any other
  # workflow triggering on the same ref and the two would cancel each other.
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # CLI-only. The webui is behind the "webui" build tag (see //webui:assets.go)
  # and is not ours again until the kanban work in story f32ea71, so this needs
  # no pnpm, no Node and no Playwright. The bridge tests skip themselves when
  # their tokens are unset, so this needs no secrets either.
  with-go:
    strategy:
      matrix:
        # 1.26 is the version //AGENTS.md requires; 1.27 is //:.tool-versions
        # and catches the next toolchain before it lands on us.
        go-version: [1.26.x, 1.27.x]
        platform: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.platform }}
    steps:
      - name: Check out code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go ${{ matrix.go-version }}
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ matrix.go-version }}

      - name: Build
        run: go build ./...

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test ./...

  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: 1.27.x

      - name: Check formatting
        run: test -z "$(gofmt -l .)"

      # the man pages in //doc:man, the markdown in //doc:md and the shell
      # completions in //misc:completion are generated from the cobra command
      # tree and committed, so the release archives can ship them without a
      # generate step. regenerate them here and fail if the result differs from
      # what is committed. no webui build is needed first: //webui:assets.go is
      # behind a build tag, so //doc:generate.go compiles without the assets.
      - name: Check generated files are up to date
        run: |
          go generate
          git diff --exit-code -- doc/man doc/md misc/completion
