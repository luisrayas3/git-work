---
name: scan

on:
  push:
    branches:
      - trunk
  pull_request:
    branches:
      - trunk
  schedule:
    - cron: '0 12 * * 6'

permissions:
  contents: read

jobs:
  # Dependabot already opens a pull request when a dependency has a known
  # vulnerability; govulncheck adds the part dependabot cannot do, which is
  # deciding whether the vulnerable code is actually reachable from this
  # module. Same check as `make secure`, pinned to the version in //:go.mod.
  #
  # Upstream also ran CodeQL here. It is dropped: this fork's own code is a
  # thin layer over an upstream that CodeQL already scans, and the minutes buy
  # more elsewhere.
  govulncheck:
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: 1.27.x

      # the webui is only compiled in behind the "webui" build tag (see
      # //webui:assets.go), so this needs no frontend build.
      - name: Run govulncheck
        run: make secure
