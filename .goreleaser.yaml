# yaml-language-server: $schema=https://goreleaser.com/static/schema.json
---
version: 2

project_name: git-work

report_sizes: true

builds:
  - id: git-work
    main: .
    binary: git-work
    env:
      - CGO_ENABLED=0
    flags:
      - -trimpath
    ldflags:
      # main.version is read by //:version.go. Everything else shown by
      # `git-work version` (commit, dirty, go version, os, arch) comes from the
      # build metadata go stamps into the binary on its own.
      - -s -w -X main.version=v{{ .Version }}
    mod_timestamp: "{{ .CommitTimestamp }}"
    targets:
      - linux_amd64
      - linux_arm64
      - linux_arm_6
      - linux_arm_7
      - darwin_amd64
      - darwin_arm64
      - windows_amd64
      - windows_arm64
      - freebsd_amd64
      - freebsd_arm64
      - openbsd_amd64
      - netbsd_amd64

archives:
  # The primary artifact: a versioned archive carrying the binary alongside the
  # man pages and shell completions generated by `go generate`.
  - id: archive
    ids:
      - git-work
    wrap_in_directory: true
    formats:
      - tar.gz
    format_overrides:
      - goos: windows
        formats:
          - zip
    name_template: >-
      {{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}{{ with .Arm }}v{{ . }}{{ end }}
    files:
      - README.md
      - LICENSE
      - INSTALLATION.md
      - src: doc/man/*.1
        dst: man
        strip_parent: true
      - src: misc/completion/*/git-work
        dst: completion

  # Bare binaries, so /releases/latest/download/git-work_<os>_<arch> is a
  # stable download URL.
  - id: binary
    ids:
      - git-work
    formats:
      - binary
    name_template: >-
      {{ .ProjectName }}_{{ .Os }}_{{ .Arch }}{{ with .Arm }}v{{ . }}{{ end }}

# Linux packages. These are the only channel we publish ourselves: Homebrew,
# AUR, nixpkgs, Scoop and the FreeBSD port are all maintained downstream by
# other people, and are deliberately left alone.
nfpms:
  - id: packages
    ids:
      - git-work
    package_name: git-work
    vendor: git-work
    homepage: https://github.com/git-bug/git-bug
    maintainer: Michael Muré <batolettre@gmail.com>
    description: Distributed, offline-first bug tracker embedded in git, with bridges
    license: GPL-3.0-or-later
    formats:
      - deb
      - rpm
      - apk
      - archlinux
    bindir: /usr/bin
    contents:
      # unlike the archives, a package can put these where the system will
      # actually find them
      - src: doc/man/*.1
        dst: /usr/share/man/man1
      - src: misc/completion/bash/git-work
        dst: /usr/share/bash-completion/completions/git-work
      - src: misc/completion/zsh/git-work
        dst: /usr/share/zsh/site-functions/_git-work
      - src: misc/completion/fish/git-work
        dst: /usr/share/fish/vendor_completions.d/git-work.fish

sboms:
  - id: archive
    artifacts: archive

# Keyless signing: in CI, cosign gets its identity from the GitHub OIDC token,
# so there is no key to manage. Signing the checksum file covers every artifact
# listed in it with a single signature.
signs:
  - cmd: cosign
    artifacts: checksum
    output: true
    certificate: "${artifact}.pem"
    args:
      - sign-blob
      - "--output-certificate=${certificate}"
      - "--output-signature=${signature}"
      - "${artifact}"
      - "--yes"

checksum:
  name_template: checksums.txt

snapshot:
  version_template: "{{ incpatch .Version }}-next"

changelog:
  use: github-native

release:
  draft: true
  prerelease: auto
