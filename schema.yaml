# This repository's schema: the three types the tracker uses, applied with
# `git work schema import schema.yaml` (0740bf3: the tree is for authoring,
# refs are the runtime truth).
#
# It started as the jira preset (59fed1c) and was trimmed on 2026-10-08 to
# what holds issues, because `git work quickstart` prints every type to an
# agent. The presets live in code (`git work schema init jira|linear`) and
# are tested there.
#
# `decision` is this repository's own; `area` is where the migration
# (bf6f392, doc/design/store-migration.md) put the labels the tracker used to
# simulate it with.
#
# `shared` is authoring only. The YAML parser expands every anchor, and the
# store holds one entity per (type, field) (e7e58f2).

shared:
  # One workflow for every type. Jira's four states plus a backlog and a
  # cancellation, so that all five categories are exercised; everything keyed
  # on "is this done" reads the category, never the name (D2).
  status: &status
    kind: enum
    name: Status
    description: Where the work stands.
    values:
      - {id: backlog,     name: Backlog,     category: backlog}
      - {id: to-do,       name: To Do,       category: unstarted}
      - {id: in-progress, name: In Progress, category: started}
      - {id: in-review,   name: In Review,   category: started}
      - {id: done,        name: Done,        category: completed}
      - {id: canceled,    name: Canceled,    category: canceled}

  priority: &priority
    kind: ordinal-enum
    name: Priority
    description: Jira's five priorities, most urgent first.
    values:
      - {id: highest, name: Highest}
      - {id: high,    name: High}
      - {id: medium,  name: Medium}
      - {id: low,     name: Low}
      - {id: lowest,  name: Lowest}

  # The tracker's own field, migrated from labels (bf6f392).
  area: &area
    kind: multi-enum
    name: Area
    description: The parts of the code base the work touches.
    values:
      - {id: core,        name: Core}
      - {id: issue-model, name: Issue model}
      - {id: bridge,      name: Bridge}
      - {id: cli,         name: CLI}
      - {id: tui,         name: Terminal renderer}
      - {id: gui,         name: GUI}
      - {id: mcp,         name: MCP}
      - {id: infra,       name: Infrastructure}

types:
  story:
    name: Story
    description: A user-facing change, designed in doc/design before its tasks.
    fields:
      status: *status
      priority: *priority
      area: *area

  # The parent's inverse is derived, never stored (D4): `children` is what a
  # story reads, never a key an issue writes.
  task:
    name: Task
    description: Work that is not a user-facing story.
    fields:
      status: *status
      priority: *priority
      parent:
        kind: relation
        name: Parent
        inverse: children
        target_types: [story]
      area: *area

  # This repository's own: a call made and its reasoning, closed once recorded.
  decision:
    name: Decision
    description: A design call and its reasoning; closed once it is recorded.
    fields:
      status: *status
      priority: *priority
      parent:
        kind: relation
        name: Parent
        inverse: children
        target_types: [story, task]
      area: *area
